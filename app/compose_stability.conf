# Compose compiler stability configuration.
#
# These classes are immutable value holders that live outside the Compose
# modules, so the compiler cannot infer their stability on its own. Listing them
# lets Compose skip recomposition when only their identity changes.
com.nebula.browser.core.BrowserSettings
com.nebula.browser.core.BrowserTab
com.nebula.browser.core.Workspace
com.nebula.browser.core.Bookmark
com.nebula.browser.core.HistoryEntry
com.nebula.browser.core.DownloadItem
com.nebula.browser.core.SearchEngine
com.nebula.browser.core.HomeShortcut
com.nebula.browser.core.PasswordCredential
com.nebula.browser.core.ExtensionReport
com.nebula.browser.core.SearchQuery
com.nebula.browser.core.UserScript
